<!DOCTYPE html>
<html lang="en">

  <main class="content">

    <section id="about">
      <h2>About Me</h2>
      <div data-render="about"></div> <!-- data/profile.js -->

    <section id="life">

    </section>

    <section id="education">

    </section>

    <section id="certifications">

      <div data-render="certifications"></div> <!-- data/achievements.js -->
    </section>

    <section id="awards">
      <h2>Awards &amp; Achievements</h2>
      <div data-render="awards"></div> <!-- data/achievements.js -->
    </section>

    <section id="contact">
      <h2>Contact</h2>

  <footer id="footer">

    <ul>

  <!-- Content -->
  <script src="data/profile.js"></script>
  <script src="data/experience.js"></script>
  <script src="data/projects.js"></script>
  <script src="data/skills.js"></script>
  <script src="data/education.js"></script>
  <script src="data/achievements.js"></script>

  <!-- Rendering -->
  <script src="assets/js/helpers.js"></script>
